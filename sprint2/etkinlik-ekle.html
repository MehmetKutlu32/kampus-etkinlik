<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kampüs Etkinlikleri — Etkinlik Ekle</title>
  <link rel="stylesheet" href="css/2416501002.css">
</head>
<body>

  <header>
    <div class="header-icerik">
      <div>
        <h1>Etkinlik Ekle</h1>
        <p>Yeni bir kampüs etkinliği oluşturun</p>
      </div>
      <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html" class="aktif">Etkinlik Ekle</a>
        <a href="etkinlik-guncelle.html">Etkinlik Güncelle</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-kart">
      <h2>Yeni Etkinlik Formu</h2>
      <p class="form-bilgi">Yıldızlı (*) alanlar zorunludur. Boş bırakılan zorunlu alanlar kırmızı ile işaretlenir.</p>

      <form action="etkinlikler.html" method="get">
        <div class="form-grup">
          <label for="ad">Etkinlik Adı *</label>
          <input type="text" id="ad" name="ad" maxlength="80" placeholder="Örn. Kariyer Günleri 2026" required>
        </div>

        <div class="form-grup">
          <label for="kategori">Kategori *</label>
          <select id="kategori" name="kategori" required>
            <option value="">Seçiniz</option>
            <option value="seminer">Seminer</option>
            <option value="atolye">Atölye</option>
            <option value="soylesi">Söyleşi</option>
            <option value="yarisma">Yarışma</option>
          </select>
        </div>

        <div class="form-grup">
          <label for="tarih">Tarih *</label>
          <input type="date" id="tarih" name="tarih" required>
        </div>

        <div class="form-grup">
          <label for="saat">Saat *</label>
          <input type="time" id="saat" name="saat" required>
        </div>

        <div class="form-grup">
          <label for="yer">Yer *</label>
          <input type="text" id="yer" name="yer" maxlength="80" placeholder="Örn. A Blok Konferans Salonu" required>
        </div>

        <div class="form-grup">
          <label for="kontenjan">Kontenjan</label>
          <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000" placeholder="Örn. 120">
        </div>

        <div class="form-grup">
          <label for="aciklama">Açıklama</label>
          <textarea id="aciklama" name="aciklama" rows="5" placeholder="Etkinlik hakkında detaylı bilgi..."></textarea>
        </div>

        <div class="form-butonlar">
          <button type="submit" class="buton-kaydet">Kaydet</button>
          <button type="reset">Temizle</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>Mehmet Kutlu &middot; 2416501002 &middot; 2026</p>
  </footer>

</body>
</html>
