<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kampüs Etkinlikleri — Etkinlik Ekle</title>
  <link rel="stylesheet" href="css/2416501002.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>

  <header>
    <div class="header-icerik">
      <div>
        <h1>Etkinlik Ekle</h1>
        <p>Yeni bir kampüs etkinliği oluşturun</p>
      </div>
      <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html" class="aktif">Ekle</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-kart">
      <h2>Yeni Etkinlik Formu</h2>
      <p class="form-bilgi">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>

      <form id="etkinlik-formu" novalidate data-mode="ekle">
        <div class="form-grup">
          <label for="ad">Etkinlik Adı *</label>
          <input type="text" id="ad" name="ad" maxlength="80" placeholder="Örn. Kariyer Günleri 2026">
          <span class="hata-mesaji" id="ad-hata"></span>
        </div>

        <div class="form-grup">
          <label for="kategori">Kategori *</label>
          <select id="kategori" name="kategori">
            <option value="">Seçiniz</option>
            <option value="Seminer">Seminer</option>
            <option value="Atölye">Atölye</option>
            <option value="Söyleşi">Söyleşi</option>
          </select>
          <span class="hata-mesaji" id="kategori-hata"></span>
        </div>

        <div class="form-grup">
          <label for="tarih">Tarih *</label>
          <input type="date" id="tarih" name="tarih">
          <span class="hata-mesaji" id="tarih-hata"></span>
        </div>

        <div class="form-grup">
          <label for="saat">Saat *</label>
          <input type="time" id="saat" name="saat">
          <span class="hata-mesaji" id="saat-hata"></span>
        </div>

        <div class="form-grup">
          <label for="yer">Yer *</label>
          <input type="text" id="yer" name="yer" maxlength="80" placeholder="Örn. A Blok Konferans Salonu">
          <span class="hata-mesaji" id="yer-hata"></span>
        </div>

        <div class="form-grup">
          <label for="kontenjan">Kontenjan</label>
          <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000" placeholder="Örn. 120">
          <span class="hata-mesaji" id="kontenjan-hata"></span>
        </div>

        <div class="form-grup">
          <label for="aciklama">Açıklama</label>
          <textarea id="aciklama" name="aciklama" rows="5" placeholder="Etkinlik hakkında detaylı bilgi..."></textarea>
          <span class="hata-mesaji" id="aciklama-hata"></span>
        </div>

        <div class="form-butonlar">
          <button type="submit" class="buton-kaydet">Kaydet</button>
          <button type="reset">Temizle</button>
        </div>

        <div id="form-mesaj" class="form-mesaj-kutusu"></div>
      </form>
    </div>
  </main>

  <footer>
    <p>Mehmet Kutlu &middot; 2416501002 &middot; 2026</p>
  </footer>

</body>
</html>
